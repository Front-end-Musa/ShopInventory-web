<aside class="sidebar" aria-label="Main navigation">
  <a class="brand" routerLink="/products" aria-label="Shop Inventory home">
    <span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="brand-copy"
      ><strong>Shop Inventory</strong><small>Less stock. More control.</small></span
    >
  </a>

  <nav class="primary-nav" aria-label="Main menu">
    @for (section of sidebarSections; track $index) {
      <a
        class="nav-link"
        [routerLink]="section.link"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="nav-icon" aria-hidden="true"><mat-icon>{{ section.icon }}</mat-icon></span><span>{{ section.title }}</span>
      </a>
    }
  </nav>

  <a class="settings-link" routerLink="/settings" routerLinkActive="active">
    <span class="nav-icon" aria-hidden="true">⚙</span><span>Settings</span>
  </a>

  <section class="sidebar-promo" aria-label="Inventory tip">
    <div class="promo-glow" aria-hidden="true"></div>
    <div class="promo-content">
      <span class="promo-label">SHOP SMARTER</span>
      <h2>Your shop,<br />under control.</h2>
      <p>Track stock, manage products, and keep your business growing.</p>
      <button type="button" aria-label="Learn more">→</button>
    </div>
  </section>
</aside>
