<aside aria-label="Workspace" class="sidebar" [class.compact]="compact()">
  <a class="brand" routerLink="/products"
    ><span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i></span
    ><span class="brand-copy"
      ><strong>Shop Inventory</strong><small>Less stock. More control.</small></span
    ></a
  >
  <mat-nav-list aria-label="Main navigation">
    @for (section of sidebarSections; track section.link) {
      <a
        mat-list-item
        [routerLink]="section.link"
        routerLinkActive="active"
        #active="routerLinkActive"
        [activated]="active.isActive"
        [attr.aria-current]="active.isActive ? 'page' : null"
        ><mat-icon matListItemIcon>{{ section.icon }}</mat-icon
        ><span matListItemTitle>{{ section.title }}</span></a
      >
    }
  </mat-nav-list>
  @if (!compact()) {
    <section class="sidebar-promo" aria-label="Inventory tip">
      <div class="promo-glow" aria-hidden="true"></div>
      <div class="promo-content">
        <span class="promo-label">SHOP SMARTER</span>
        <h2>Your shop,<br />under control.</h2>
        <p>Track stock, manage products, and keep your business growing.</p>
        <button
          mat-icon-button
          type="button"
          aria-label="Learn more about managing inventory"
          (click)="help()"
        >
          <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </section>
  }
</aside>
